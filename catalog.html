<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

    <header>
        <div class="nav">
            <div class="logo">
                <a href="index.html">PC Store</a> 
            </div>

            <div class="nav-links">
                <a href="index.html">Главная</a>
                <a href="cart.html">Корзина</a>
                <a href="favorites.html">Избранное</a>
                <div id="navProfile"></div>
            </div>
        </div>
    </header>

    <h1 class="section-title">Каталог товаров</h1>

    <div class="filters">
        <input type="text" id="searchInput" placeholder="Поиск товаров...">

        <select id="categoryFilter">
            <option value="">Все категории</option>
            <option value="Видеокарты">Видеокарты</option>
            <option value="Процессоры">Процессоры</option>
            <option value="Материнские платы">Материнские платы</option>
            <option value="SSD">SSD-накопители</option>
            <option value="Оперативная память">Оперативная память</option>
            <option value="Охлаждение">Охлаждение</option>
            <option value="Корпуса">Корпуса</option>
            <option value="Блоки питания">Блоки питания</option>
            <option value="Мониторы">Мониторы</option>
            <option value="Клавиатуры">Клавиатуры</option>
            <option value="Мыши">Мыши</option>
            <option value="Аксессуары">Аксессуары</option>
        </select>

        <select id="sortSelect">
            <option value="">Без сортировки</option>
            <option value="priceAsc">Цена ↑</option>
            <option value="priceDesc">Цена ↓</option>
            <option value="rating">Рейтинг</option>
        </select>
    </div>

    <div class="products-grid" id="catalogProducts"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="productModal"></div>
</div>

<script src="data/products.js"></script>
<script src="js/storage.js"></script>
<script src="js/navbar.js"></script>
<script src="js/catalog.js"></script>
<script src="js/modal.js"></script>
<script src="js/cart.js"></script>
<script src="js/favorites.js"></script>
</body>
</html>
