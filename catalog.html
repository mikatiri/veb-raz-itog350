<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

    <header>
        <div class="nav">

            <div class="logo">
                <a href="index.html">PC Store</a> 
            </div>

            <div class="nav-links">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <div id="navProfile"></div>
            </div>
            
        </div>
    </header>

    <h1 class="section-title">
        Каталог товаров
    </h1>

    <div class="filters">

        <input
            type="text"
            id="searchInput"
            placeholder="Поиск товаров..."
        >

        <select id="categoryFilter">
            <option value="">Все категории</option>
            <option value="Видеокарты">Видеокарты</option>
            <option value="Процессоры">Процессоры</option>
            <option value="SSD">SSD</option>
            <option value="Материнские платы">Материнские платы</option>
        </select>

        <select id="sortSelect">
            <option value="">Без сортировки</option>
            <option value="priceAsc">Цена ↑</option>
            <option value="priceDesc">Цена ↓</option>
            <option value="rating">Рейтинг</option>
        </select>

    </div>

    <div class="products-grid" id="catalogProducts"></div>

</div>

<script src="data/products.js"></script>
<script src="js/catalog.js"></script>

</body>
</html>
